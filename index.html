<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogiFlow Pro — Johnson Electric</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sb:#0A0A0A;--sbb:rgba(255,255,255,.06);--sbh:rgba(255,255,255,.05);--sba:rgba(244,121,32,.15);
  --acc:#F47920;--acc2:#D4600A;
  --blue:#2563EB;--bl:#EFF6FF;--bm:#BFDBFE;
  --green:#059669;--gl:#ECFDF5;--gm:#A7F3D0;
  --amber:#D97706;--al:#FFFBEB;--am:#FDE68A;
  --red:#DC2626;--rl:#FEF2F2;--rm:#FECACA;
  --t1:#0F172A;--t2:#334155;--t3:#64748B;--t4:#94A3B8;
  --sur:#F1F5F9;--sur2:#F8FAFC;--w:#FFFFFF;
  --br:#E2E8F0;--br2:#CBD5E1;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--sur);color:var(--t1);font-size:13px;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100vh;width:100vw;overflow:hidden}

/* SIDEBAR */
.sb{width:228px;height:100vh;background:var(--sb);display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid var(--sbb)}
.sb-top{padding:18px 14px 16px;border-bottom:1px solid var(--sbb)}
.sb-logo{display:flex;align-items:center;gap:10px}
.sb-mark{width:33px;height:33px;background:var(--acc);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-name{font-size:13px;font-weight:700;color:#fff}
.sb-ver{font-size:9.5px;color:rgba(255,255,255,.3);margin-top:1px}
.sb-usr{padding:11px 14px;border-bottom:1px solid var(--sbb);display:flex;align-items:center;gap:9px}
.sb-av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.sb-un{font-size:12px;font-weight:600;color:rgba(255,255,255,.9)}
.sb-ur{font-size:10px;color:rgba(255,255,255,.32);margin-top:1px}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.sb-sec{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.2);padding:0 7px;margin:10px 0 4px}
.sb-btn{display:flex;align-items:center;gap:9px;padding:8px 7px;border-radius:7px;cursor:pointer;color:rgba(255,255,255,.45);font-size:12.5px;border:none;background:none;width:100%;text-align:left;margin-bottom:1px;transition:all .12s}
.sb-btn:hover{background:var(--sbh);color:rgba(255,255,255,.8)}
.sb-btn.on{background:var(--sba);color:#fff;font-weight:500}
.sb-bdg{margin-left:auto;background:var(--acc);color:#fff;font-size:9.5px;padding:1px 6px;border-radius:9px;font-weight:700}
.sb-foot{padding:10px 8px;border-top:1px solid var(--sbb)}
.sb-out{display:flex;align-items:center;gap:9px;padding:8px 7px;border-radius:7px;cursor:pointer;color:rgba(255,255,255,.28);font-size:12px;background:none;border:none;width:100%;transition:all .12s}
.sb-out:hover{background:rgba(255,255,255,.04);color:rgba(255,255,255,.55)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden}
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--br);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.tb-title{font-size:15px;font-weight:700;color:var(--t1)}.tb-title span{color:#F47920}
.tb-date{font-size:11.5px;color:var(--t4);margin-left:10px;padding-left:10px;border-left:1px solid var(--br)}
.tb-right{margin-left:auto;display:flex;gap:8px}
.page{flex:1;overflow-y:auto;padding:20px 24px}
.page::-webkit-scrollbar{width:5px}
.page::-webkit-scrollbar-thumb{background:var(--br2);border-radius:6px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:0 13px;height:31px;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:background .12s;font-family:inherit;white-space:nowrap}
.btn-p{background:var(--acc);color:#fff}.btn-p:hover{background:var(--acc2)}
.btn-g{background:transparent;color:var(--t2);border-color:var(--br)}.btn-g:hover{background:var(--sur)}
.btn-s{background:var(--green);color:#fff}.btn-s:hover{background:#047857}
.btn-d{background:var(--red);color:#fff}.btn-d:hover{background:#B91C1C}
.btn-sm{height:27px;padding:0 10px;font-size:12px}
.btn-xs{height:24px;padding:0 9px;font-size:11px}

/* METRICS */
.mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.mcard{background:#fff;border:1px solid var(--br);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.07);position:relative;overflow:hidden}
.mcard::before{content:"";position:absolute;top:0;left:0;right:0;height:2.5px;border-radius:12px 12px 0 0}
.mc-b::before{background:linear-gradient(90deg,#2563EB,#60A5FA)}
.mc-g::before{background:linear-gradient(90deg,#059669,#34D399)}
.mc-a::before{background:linear-gradient(90deg,#D97706,#FCD34D)}
.mc-r::before{background:linear-gradient(90deg,#DC2626,#F87171)}
.mc-ico{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.mc-lbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.mc-val{font-size:26px;font-weight:800;color:var(--t1);line-height:1;letter-spacing:-1px}
.mc-val.money{font-size:18px;letter-spacing:-.4px}
.mc-foot{font-size:11px;color:var(--t4);margin-top:4px}
.tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:4px}
.tag-g{color:var(--green);background:var(--gl)}
.tag-r{color:var(--red);background:var(--rl)}
.tag-a{color:var(--amber);background:var(--al)}

/* GRID & CARDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--br);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:12px}
.card:last-child{margin-bottom:0}
.c-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.c-title{font-size:13px;font-weight:700;color:var(--t1)}
.c-sub{font-size:11px;color:var(--t3);margin-top:1px}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:1.5px solid var(--br)}
th{text-align:left;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;padding:0 12px 9px;white-space:nowrap}
td{padding:10px 12px;font-size:12.5px;color:var(--t2);border-bottom:1px solid var(--sur)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#FAFBFC}
.mono{font-family:monospace;font-size:11.5px;font-weight:500;color:var(--t3)}
.bold{font-weight:700;color:var(--t1)}

/* BADGES */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.bdg-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;display:inline-block}
.b-pend{background:#FEF3C7;color:#92400E}
.b-appr{background:#D1FAE5;color:#065F46}
.b-wait{background:#DBEAFE;color:#1E40AF}
.b-rej{background:#FEE2E2;color:#991B1B}
.b-comp{background:#EDE9FE;color:#4C1D95}
.b-neut{background:#F3F4F6;color:#374151}
.b-ok{background:#ECFDF5;color:#065F46}
.b-transit{background:#EDE9FE;color:#4C1D95}
.b-transit .bdg-dot{background:#8B5CF6}

/* PRIORITY */
.pr{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;border:1px solid}
.pr-l{background:#F9FAFB;color:#6B7280;border-color:#E5E7EB}
.pr-n{background:var(--bl);color:#1D4ED8;border-color:var(--bm)}
.pr-h{background:var(--al);color:#B45309;border-color:var(--am)}
.pr-u{background:var(--rl);color:#991B1B;border-color:var(--rm)}

/* FORM */
.fsec{margin-bottom:18px}
.fsec-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--br)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.f-full{grid-column:1/-1}
.fgrp{display:flex;flex-direction:column;gap:4px}
.flbl{font-size:11.5px;font-weight:600;color:var(--t2)}
.flbl em{color:var(--red);font-style:normal}
.finp,.fsel,.ftxt{padding:8px 11px;border:1.5px solid var(--br);border-radius:8px;font-size:13px;color:var(--t1);background:#fff;width:100%;outline:none;transition:border-color .12s;font-family:inherit}
.finp:focus,.fsel:focus,.ftxt:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(244,121,32,.07)}
.finp:disabled{background:var(--sur);color:var(--t3)}
.ftxt{resize:vertical;min-height:68px;line-height:1.5}
.fhint{font-size:10.5px;color:var(--t4)}

/* MODAL */
.m-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.m-box{background:#fff;border-radius:16px;width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 48px rgba(0,0,0,.14);border:1px solid var(--br)}
.m-head{padding:16px 20px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.m-title{font-size:14px;font-weight:700;color:var(--t1)}
.m-body{padding:18px 20px;overflow-y:auto;flex:1}
.m-foot{padding:12px 20px;border-top:1px solid var(--br);display:flex;gap:7px;justify-content:flex-end;background:var(--sur2);flex-shrink:0;border-radius:0 0 16px 16px}

/* DETAIL */
.dg{display:grid;grid-template-columns:1fr 1fr}
.dr{padding:8px 0;border-bottom:1px solid var(--sur);display:flex;flex-direction:column;gap:3px}
.dr:nth-child(odd){padding-right:16px}
.dk{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--t4)}
.dv{font-size:13px;color:var(--t1);font-weight:500}

/* TIMELINE */
.tl{display:flex;flex-direction:column}
.tli{display:flex;gap:11px;position:relative}
.tli:not(:last-child)::after{content:"";position:absolute;left:13px;top:28px;bottom:0;width:1px;background:var(--br)}
.tld{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1;font-size:12px;font-weight:700;border:2px solid}
.dot-new{background:#F1F5F9;color:var(--t3);border-color:var(--br)}
.dot-ok{background:var(--gl);color:var(--green);border-color:var(--gm)}
.dot-no{background:var(--rl);color:var(--red);border-color:var(--rm)}
.tlb{flex:1;padding-bottom:14px}
.tla2{font-size:13px;font-weight:600;color:var(--t1)}
.tlm{font-size:11px;color:var(--t4);margin-top:2px}
.tln{font-size:12px;color:var(--t2);margin-top:6px;padding:7px 11px;background:var(--bl);border-radius:6px;border-left:3px solid var(--blue)}

/* CHARTS */
.bch{display:flex;align-items:flex-end;gap:10px;height:90px;margin-top:8px}
.bitem{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.bfill{width:100%;border-radius:4px 4px 0 0;min-height:4px}
.blbl{font-size:10px;color:var(--t3);text-align:center;white-space:nowrap}
.bnum{font-size:11px;font-weight:700;color:var(--t2)}
.prog{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.prog-h{display:flex;justify-content:space-between;align-items:center}
.prog-t{height:5px;background:var(--sur);border-radius:3px;overflow:hidden;margin-top:3px}
.prog-f{height:100%;border-radius:3px}

/* FILTERS */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.srch{position:relative;flex:1;min-width:180px}
.srch-ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--t4);pointer-events:none;font-size:13px}
.srch-inp{padding:7px 10px 7px 30px;border:1.5px solid var(--br);border-radius:8px;font-size:12.5px;color:var(--t1);background:#fff;width:100%;outline:none;font-family:inherit;transition:border-color .12s}
.srch-inp:focus{border-color:var(--acc)}
.fsel2{padding:6px 9px;border:1.5px solid var(--br);border-radius:8px;font-size:12px;color:var(--t2);background:#fff;cursor:pointer;outline:none;font-family:inherit}

/* TABS */
.tabs{display:flex;border-bottom:1.5px solid var(--br);margin-bottom:13px}
.tab{padding:7px 13px;font-size:12.5px;font-weight:500;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:all .12s;user-select:none}
.tab:hover{color:var(--t1)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}

/* ALERTS */
.alert{padding:10px 13px;border-radius:8px;font-size:12.5px;margin-bottom:13px;display:flex;align-items:flex-start;gap:8px;border:1px solid}
.al-i{background:var(--bl);color:#1E40AF;border-color:var(--bm)}
.al-s{background:var(--gl);color:#065F46;border-color:var(--gm)}
.al-w{background:var(--al);color:#92400E;border-color:var(--am)}

/* APPROVE */
.ap-card{background:#fff;border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:10px;display:flex;align-items:flex-start;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.ap-body{flex:1}
.ap-acts{display:flex;flex-direction:column;gap:6px;flex-shrink:0;min-width:118px}
.ap-div{height:1px;background:var(--sur);margin:10px 0}

/* CARRIER */
.car-card{background:#fff;border:1px solid var(--br);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.car-logo{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;border-radius:10px;flex-shrink:0;width:42px;height:42px}
.car-stat{padding:9px;background:var(--sur2);border-radius:6px;text-align:center;border:1px solid var(--br)}
.car-sv{font-size:17px;font-weight:800;color:var(--t1);line-height:1}
.car-sl{font-size:9px;color:var(--t3);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}

/* QUEUE */
.q-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--br);border-radius:12px;margin-bottom:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.07)}

/* NOTIFICATIONS */
#notifs{position:fixed;top:16px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.notif{background:#fff;border:1px solid var(--br);border-radius:12px;padding:11px 15px;font-size:12.5px;max-width:320px;box-shadow:0 20px 48px rgba(0,0,0,.14);pointer-events:auto;display:flex;align-items:center;gap:9px;animation:nIn .2s ease}
.n-ico{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.notif.ns .n-ico{background:var(--gl);color:var(--green)}
.notif.ne .n-ico{background:var(--rl);color:var(--red)}
.notif.ni .n-ico{background:var(--bl);color:var(--blue)}
.n-txt{font-weight:500;color:var(--t1)}
@keyframes nIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* LOGIN */
.lw{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sb)}
.l-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 55%,rgba(244,121,32,.09),transparent 55%),radial-gradient(ellipse at 75% 20%,rgba(37,99,235,.06),transparent 45%);pointer-events:none}
.l-card{background:#fff;border-radius:20px;padding:34px;width:410px;position:relative;z-index:1;box-shadow:0 32px 80px rgba(0,0,0,.5)}
.l-ico{width:50px;height:50px;background:var(--acc);border-radius:13px;display:flex;align-items:center;justify-content:center;margin:0 auto 13px;box-shadow:0 8px 20px rgba(244,121,32,.3)}
.l-ttl{font-size:22px;font-weight:800;color:var(--t1);letter-spacing:-.5px;text-align:center}
.l-sub{font-size:12.5px;color:var(--t3);text-align:center;margin-top:4px}
.l-tag{display:inline-flex;align-items:center;gap:4px;background:var(--rl);color:var(--red);font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:8px;letter-spacing:.2px}
.l-slbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:9px;margin-top:24px}
.lp{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1.5px solid var(--br);border-radius:10px;cursor:pointer;transition:all .15s;margin-bottom:7px;background:#fff}
.lp:hover{border-color:var(--acc);background:#FFF5F5;transform:translateX(2px)}
.lp-av{border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;width:36px;height:36px}
.lp-name{font-size:13px;font-weight:600;color:var(--t1)}
.lp-role{font-size:11px;color:var(--t3);margin-top:1px}
.lp-arr{margin-left:auto;color:var(--t4);font-size:18px}
.l-foot{margin-top:16px;padding:10px 12px;background:var(--sur2);border-radius:8px;border:1px solid var(--br);font-size:11px;color:var(--t3);text-align:center;line-height:1.6}
@media(max-width:768px){
  #app{flex-direction:column}
  .sb{width:100%;height:auto;flex-direction:row;flex-shrink:0;border-right:none;border-bottom:1px solid var(--sbb);overflow-x:auto}
  .sb-top{padding:10px 12px}
  .sb-usr{display:none}
  .sb-nav{display:flex;flex-direction:row;padding:6px 8px;overflow-x:auto;flex:unset}
  .sb-sec{display:none}
  .sb-btn{padding:6px 10px;margin-bottom:0;margin-right:2px;white-space:nowrap;flex-shrink:0}
  .sb-foot{display:none}
  .main{height:calc(100vh - 110px);overflow-y:auto}
  .topbar{padding:0 14px}
  .pg{padding:12px}
  .cards{grid-template-columns:1fr 1fr}
  .tbl{font-size:11.5px}
  .modal-box{width:96vw;max-width:96vw;margin:10px auto}
  .kpi-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

function getSuggestedFreight(destCity,destUF,vehicleType){
  var city=destCity.trim().toLowerCase();
  var match=FREIGHT_TABLE.filter(function(f){
    return f.vehicle===vehicleType&&f.uf===destUF&&f.dest.toLowerCase().indexOf(city)>-1;
  })[0];
  if(!match){
    var byUF=FREIGHT_TABLE.filter(function(f){return f.vehicle===vehicleType&&f.uf===destUF;});
    if(byUF.length>0){
      var avg=byUF.reduce(function(s,f){return s+f.value;},0)/byUF.length;
      return{value:avg,matched:false,note:'Estimativa para '+destUF+' (cidade não cadastrada)'};
    }
    return null;
  }
  return{value:match.value,matched:true,note:'Tabela Tecea Cargo — '+match.dest+'/'+match.uf};
}

function filt(){
  var r=S.reqs.slice();
  if(S.user.role==="solicitante")r=r.filter(function(x){return x.rid===S.user.id;});
  if(S.user.role==="transportadora")r=r.filter(function(x){return["pending_carrier","approved","in_transit","completed","rejected_carrier"].indexOf(x.st)>-1;});
  if(S.fs)r=r.filter(function(x){return x.st===S.fs;});
  if(S.fc)r=r.filter(function(x){return x.cid===parseInt(S.fc);});
  if(S.q){var q=S.q.toLowerCase();r=r.filter(function(x){return x.mat.toLowerCase().indexOf(q)>-1||x.id.indexOf(q)>-1||x.rn.toLowerCase().indexOf(q)>-1;});}
  if(S.tab==="pending")r=r.filter(function(x){return x.st==="pending_manager";});
  if(S.tab==="active")r=r.filter(function(x){return x.st==="pending_carrier"||x.st==="approved"||x.st==="in_transit";});
  if(S.tab==="done")r=r.filter(function(x){return["completed","rejected_manager","rejected_carrier","canceled"].indexOf(x.st)>-1;});
  return r;
}

function submitForm(e){
  e.preventDefault();
  var fd=new FormData(document.getElementById("nform"));
  function gv(id){var el=document.getElementById(id);return el?el.value:'';}
  var origObj={cep:gv('orig-cep'),rua:gv('orig-rua'),num:gv('orig-num'),comp:gv('orig-comp'),bairro:gv('orig-bairro'),cidade:gv('orig-cidade'),uf:gv('orig-uf')};
  var destObj={cep:gv('dest-cep'),rua:gv('dest-rua'),num:gv('dest-num'),comp:gv('dest-comp'),bairro:gv('dest-bairro'),cidade:gv('dest-cidade'),uf:gv('dest-uf')};
  var origStr=origObj.rua+' '+origObj.num+(origObj.comp?' '+origObj.comp:'')+', '+origObj.bairro+', '+origObj.cidade+'/'+origObj.uf;
  var destStr=destObj.rua+' '+destObj.num+(destObj.comp?' '+destObj.comp:'')+', '+destObj.bairro+', '+destObj.cidade+'/'+destObj.uf;
  var vehEl=document.getElementById('veh');var vehicleLabel=vehEl?vehEl.options[vehEl.selectedIndex].text:'';
  if(S.editingId){
    var r=S.reqs.filter(function(x){return x.id===S.editingId;})[0];
    if(r){
      r.mat=fd.get("mat");r.orig=origStr;r.dest=destStr;r.origObj=origObj;r.destObj=destObj;
      r.p=fd.get("p");r.cid=parseInt(fd.get("cid"));r.val=parseFloat(fd.get("val"));
      r.dt=fd.get("dt");r.cc=fd.get("cc")||"";r.nt=fd.get("nt")||"";
      if(vehicleLabel)r.vehicleLabel=vehicleLabel;
      r.h.push({ts:nowStr(),a:S.user.name,ac:"Solicitação editada pelo solicitante",n:""});
      notif("Solicitação "+r.id+" atualizada!","s");
    }
    S.editingId=null;S.view="reqs";render();return;
  }
  var req={id:"SOL-00"+nextId++,mat:fd.get("mat"),orig:origStr,dest:destStr,origObj:origObj,destObj:destObj,p:fd.get("p"),cid:parseInt(fd.get("cid")),val:parseFloat(fd.get("val")),dt:fd.get("dt"),cc:fd.get("cc")||"",nt:fd.get("nt")||"",rid:S.user.id,rn:S.user.name,dep:S.user.dept,vehicleLabel:vehicleLabel,st:"pending_manager",cd:nowStr(),h:[{ts:nowStr(),a:S.user.name,ac:"Solicitação criada",n:""}]};
  S.reqs.unshift(req);
  S.view="reqs";
  notif("Solicitação "+req.id+" enviada ao gestor!","s");
  render();
}

function exportCSV(){
  var rows=S.reqs.filter(function(r){
    if(r.rid!==S.user.id)return false;
    if(S.exportStatus&&r.st!==S.exportStatus)return false;
    if(S.exportDateFrom&&r.dt<S.exportDateFrom)return false;
    if(S.exportDateTo&&r.dt>S.exportDateTo)return false;
    return true;
  });
  var headers=['ID','Material','Origem','Destino','Veiculo','Preco Sugerido','Status','Data','Horario','Motorista','Recebedor','Observacoes'];
  var csv='﻿'+headers.join(';')+'\n';
  rows.forEach(function(r){
    var orig=r.origObj?r.origObj.rua+' '+r.origObj.num+', '+r.origObj.cidade+'/'+r.origObj.uf:(r.orig||'');
    var dest=r.destObj?r.destObj.rua+' '+r.destObj.num+', '+r.destObj.cidade+'/'+r.destObj.uf:(r.dest||'');
    var line=[r.id,r.mat,orig,dest,r.vehicleLabel||'',(r.val||0).toFixed(2).replace('.',','),SM[r.st]?SM[r.st].l:'',r.dt||'',r.time||'',r.driverName||'',r.receiverName||'',r.nt||''].map(function(v){return'"'+(v||'').toString().replace(/"/g,'""')+'"';}).join(';');
    csv+=line+'\n';
  });
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='solicitacoes_JE_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function clearFilters(){S.fs='';S.fc='';S.q='';render();}
function setTab(t){S.tab=t;render();}
function fmtPhone(v){v=v.replace(/\D/g,'').slice(0,11);if(v.length>6)v=v.slice(0,2)+' '+v.slice(2,7)+'-'+v.slice(7);else if(v.length>2)v=v.slice(0,2)+' '+v.slice(2);return v;}
function saveDriver(id){
  var r=S.reqs.filter(function(x){return x.id===id;})[0];if(!r)return;
  var nm=(document.getElementById('drv-name')||{}).value||'';
  var ph=(document.getElementById('drv-phone')||{}).value||'';
  if(!nm||!ph){notif('Preencha nome e telefone do motorista.','e');return;}
  r.driverName=nm;r.driverPhone=ph;
  r.driverToken='TK'+Math.random().toString(36).substr(2,6).toUpperCase();
  r.h.push({ts:nowStr(),a:S.user.name,ac:'Motorista designado: '+nm,n:''});
  notif('Motorista '+nm+' designado. Token: '+r.driverToken,'s');render();
}
function sendDriverWhatsApp(id){
  var r=S.reqs.filter(function(x){return x.id===id;})[0];if(!r||!r.driverPhone)return;
  var link=window.location.href.split('?')[0]+'?driver='+r.driverToken;
  var msg=encodeURIComponent('Olá '+r.driverName+'! Você tem uma coleta.\nRota: '+r.orig+' → '+r.dest+'\nToken: '+r.driverToken+'\nAcesse: '+link);
  window.open('https://wa.me/55'+r.driverPhone.replace(/\D/g,'')+'?text='+msg,'_blank');
}
function notifyCarrierWA(id){
  var r=S.reqs.filter(function(x){return x.id===id;})[0];if(!r)return;
  var c=C(r.cid);if(!c)return;
  var msg=encodeURIComponent('Olá '+c.name+'! Nova coleta disponível.\nID: '+r.id+'\nMaterial: '+r.mat+'\nRota: '+r.orig+' → '+r.dest+'\nValor: '+R(r.val));
  window.open('https://wa.me/55'+c.tel.replace(/\D/g,'')+'?text='+msg,'_blank');
}
function onCollectPhoto(input,id){
  if(!input.files||!input.files[0])return;
  var r=S.reqs.filter(function(x){return x.id===id;})[0];if(!r)return;
  r.collectPhoto=input.files[0].name;
  S.collectPhotoPreview=URL.createObjectURL(input.files[0]);
  var prev=document.getElementById('collect-prev');
  if(prev)prev.innerHTML='<div style="font-size:11px;color:#10B981;font-weight:600;margin-top:4px">✓ '+r.collectPhoto+'</div>';
  checkDeliveryReady(id);
}
function onDeliveryPhoto(input,id){
  if(!input.files||!input.files[0])return;
  var r=S.reqs.filter(function(x){return x.id===id;})[0];if(!r)return;
  r.deliveryPhoto=input.files[0].name;
  S.deliveryPhotoPreview=URL.createObjectURL(input.files[0]);
  var prev=document.getElementById('delivery-prev');
  if(prev)prev.innerHTML='<div style="font-size:11px;color:#10B981;font-weight:600;margin-top:4px">✓ '+r.deliveryPhoto+'</div>';
  checkDeliveryReady(id);
}
function checkDeliveryReady(id){
  var r=S.reqs.filter(function(x){return x.id===id;})[0];if(!r)return;
  var btn=document.getElementById('confirm-delivery-btn');
  if(btn)btn.disabled=!(r.collectPhoto&&r.deliveryPhoto);
}
function confirmCollect(id){
  var r=S.reqs.filter(function(x){return x.id===id;})[0];if(!r)return;
  r.st='in_transit';r.h.push({ts:nowStr(),a:'Motorista',ac:'Coleta confirmada',n:''});
  notif('Coleta confirmada! Carga em trânsito.','s');render();
}
function confirmDelivery(id){
  var r=S.reqs.filter(function(x){return x.id===id;})[0];if(!r)return;
  if(!r.collectPhoto||!r.deliveryPhoto){notif('Adicione foto de coleta e entrega antes de confirmar.','e');return;}
  r.st='completed';r.h.push({ts:nowStr(),a:'Motorista',ac:'Entrega concluída',n:''});
  notif('Entrega concluída com sucesso!','s');render();
}

    '<div style="margin-bottom:8px"><div style="font-size:11px;color:#475569;margin-bottom:4px">Foto de coleta:</div>'+

  return'<div style="min-height:100vh;background:#F8FAFC;padding:20px 0">'+

var VEHICLES=[
  {type:'moto',label:'Moto',maxKg:10,maxM3:0.027},
  {type:'van',label:'Van',maxKg:500,maxM3:3},
  {type:'tres4',label:'3/4',maxKg:3500,maxM3:18},
  {type:'toco',label:'Toco',maxKg:6000,maxM3:40},
  {type:'truck',label:'Truck',maxKg:10000,maxM3:70},
  {type:'carreta',label:'Carreta',maxKg:25000,maxM3:120},
];
function maskCEP(v){v=v.replace(/\D/g,'').slice(0,8);if(v.length>5)v=v.slice(0,5)+'-'+v.slice(5);return v;}
function cepIn(el,pfx){el.value=maskCEP(el.value);if(el.value.replace(/\D/g,'').length===8)buscarCEP(pfx);}
function buscarCEP(pfx){
  var cepEl=document.getElementById(pfx+'-cep'),load=document.getElementById(pfx+'-loading');
  if(!cepEl)return;
  var cep=cepEl.value.replace(/\D/g,'');
  if(cep.length!==8)return;
  if(load)load.style.display='inline';
  fetch('https://viacep.com.br/ws/'+cep+'/json/')
    .then(function(r){return r.json();})
    .then(function(d){
      if(load)load.style.display='none';
      if(d.erro){alert('CEP não encontrado');return;}
      function s(id,v){var el=document.getElementById(pfx+'-'+id);if(el)el.value=v||'';}
      s('rua',d.logradouro);s('bairro',d.bairro);s('cidade',d.localidade);s('uf',d.uf);
      if(pfx==='dest')updateFreightSuggestion();
    })
    .catch(function(){if(load)load.style.display='none';alert('Erro ao buscar CEP.');});
}
function calcDims(){
  var comp=parseFloat((document.getElementById('dim-comp')||{}).value)||0;
  var larg=parseFloat((document.getElementById('dim-larg')||{}).value)||0;
  var alt=parseFloat((document.getElementById('dim-alt')||{}).value)||0;
  var peso=parseFloat((document.getElementById('dim-peso')||{}).value)||0;
  var res=document.getElementById('dim-result');
  if(!res)return;
  if(!comp||!larg||!alt||!peso){res.style.display='none';S._vehicle=null;var fr=document.getElementById('freight-result');if(fr)fr.style.display='none';return;}
  var volM3=(comp*larg*alt)/1000000;
  var veiculo=null;
  for(var i=0;i<VEHICLES.length;i++){if(peso<=VEHICLES[i].maxKg&&volM3<=VEHICLES[i].maxM3){veiculo=VEHICLES[i];break;}}
  if(!veiculo)veiculo=VEHICLES[VEHICLES.length-1];
  S._vehicle=veiculo;
  res.style.display='block';
  res.innerHTML='<div style="padding:10px 13px;background:#EFF6FF;border-radius:8px;border:1px solid #BFDBFE;font-size:12.5px">'+
    '<div>📦 <strong>Volume calculado:</strong> '+volM3.toFixed(4)+' m³ | Peso: '+peso+' kg</div>'+
    '<div style="margin-top:5px">🚚 <strong>Veículo sugerido:</strong> '+veiculo.label+'</div>'+
    '</div>';
  updateFreightSuggestion();
}

var _qp=new URLSearchParams(window.location.search);
var _driverParam=_qp.get('driver');
